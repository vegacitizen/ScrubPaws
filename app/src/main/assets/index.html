<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ScrubPaws</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
  /* layout: full-screen canvas game, DOM overlays for menus and the action button */
  :root{--bg:#3b2a22;--ink:#4a3226;--paper:#fff6e3;--accent:#ff8a3d;--good:#3fae6a;--bad:#e2493f;--soap:#6fd3e8;
    --display:"Jua","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;color-scheme:light}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:var(--display);color:var(--ink)}
  body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
  [hidden]{display:none!important}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #pad{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;align-items:flex-end;gap:10px}
  .pb{width:78px;height:78px;border-radius:50%;border:4px solid var(--paper);color:#fff;font:19px var(--display);touch-action:none;cursor:pointer;padding:0;
    box-shadow:0 5px 0 rgba(0,0,0,.35),0 8px 14px rgba(0,0,0,.3)}
  .pb.big{width:100px;height:100px;font-size:23px;background:var(--accent)}
  #bFeed{background:#e8a322} #bBath{background:#2aa7c9}
  #bFeed.on{outline:5px solid #fff}
  .pb.off{background:#9c8b80!important;opacity:.5}
  .pb:active{transform:translateY(3px)}
  #foods{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(128px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:min(96vw,460px)}
  .fd{font:13px var(--display);color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:4px 8px;min-width:64px;cursor:pointer;touch-action:none;box-shadow:0 4px 0 var(--ink)}
  .fd span{display:block;font-size:26px;line-height:1.15}
  @media (max-height:480px){.pb{width:62px;height:62px;font-size:16px}.pb.big{width:80px;height:80px;font-size:19px}#foods{bottom:calc(104px + env(safe-area-inset-bottom,0px))}.fd{min-width:54px;font-size:11px;padding:3px 5px}.fd span{font-size:21px}}
  #snd{position:fixed;left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:46px;height:46px;border-radius:50%;
    border:3px solid var(--paper);background:rgba(74,50,38,.8);font-size:20px;cursor:pointer;padding:0;touch-action:none;z-index:5}
  .pb:focus-visible,.fd:focus-visible,.btn:focus-visible{outline:4px solid var(--soap);outline-offset:3px}
  #ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(40,24,16,.72);
    padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));box-sizing:border-box;overflow:auto}
  #card{background:var(--paper);border-radius:26px;border:6px solid var(--ink);max-width:640px;width:100%;
    padding:20px 24px;box-sizing:border-box;text-align:center;box-shadow:0 12px 0 rgba(0,0,0,.25);max-height:100%;overflow:auto}
  #card h1{font-size:clamp(34px,7vw,56px);margin:0;color:var(--accent);font-weight:400;text-shadow:0 3px 0 var(--ink);letter-spacing:1px}
  #card h2{font-size:clamp(22px,4.4vw,30px);margin:0 0 6px;font-weight:400}
  #card p{font-size:clamp(14px,2.6vw,17px);line-height:1.5;margin:8px 0}
  .sub{color:#8a6a55}
  .rows{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
  .chip{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:6px 12px;font-size:clamp(14px,2.6vw,17px)}
  .chip b{font-weight:400;color:var(--accent)}
  .signs{text-align:left;font-size:clamp(13px,2.4vw,15.5px);line-height:1.55;margin:8px auto;display:grid;gap:2px}
  .btn{font:clamp(20px,4vw,26px) var(--display);background:var(--accent);color:#fff;border:4px solid var(--ink);border-radius:18px;
    padding:10px 34px;margin-top:10px;cursor:pointer;box-shadow:0 5px 0 var(--ink)}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
  .stars{font-size:40px;letter-spacing:6px;color:#ffb81f;text-shadow:0 2px 0 var(--ink)}
  .goodc{color:var(--good)} .badc{color:var(--bad)}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="foods" hidden></div>
<div id="pad" hidden>
  <button id="bFeed" class="pb off" type="button">먹이</button>
  <button id="bBath" class="pb off" type="button">목욕</button>
  <button id="bGrab" class="pb big off" type="button">잡기</button>
</div>
<button id="snd" type="button" aria-label="소리 켜기/끄기">🔊</button>
<div id="ov"><div id="card"></div></div>
<script>
'use strict';
/* ============================================================
   ScrubPaws — 꼬질꼬질 대소동
   집 안의 애완동물들을 씻기고 먹이며 엄마가 올 때까지 건강하게 돌보는 게임
   ============================================================ */
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const R = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const pick = a => a[Math.floor(Math.random() * a.length)];
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const TAU = Math.PI * 2;

/* ---------- 화면 ---------- */
const WW = 1120, WH = 540;
let VW = 1120, VH = 540, SC = 1, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const w = window.innerWidth, h = window.innerHeight;
  SC = Math.min(h / WH, w / WW);
  VW = w / SC; VH = h / SC;
  cv.width = Math.round(w * DPR); cv.height = Math.round(h * DPR);
}
window.addEventListener('resize', resize); resize();

/* ---------- 색 ---------- */
function rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
const mixCache = {};
function mix(a, b, t) {
  t = Math.round(clamp(t, 0, 1) * 20) / 20; const k = a + b + t; if (mixCache[k]) return mixCache[k];
  const A = rgb(a), B = rgb(b);
  return mixCache[k] = 'rgb(' + A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',') + ')';
}

/* ---------- 소리 (WebAudio 합성) ---------- */
let ac = null, master = null, muted = false;
try { muted = localStorage.getItem('scrubpaws_mute') === '1'; } catch (e) { }
function initAudio() {
  if (!ac) {
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      const comp = ac.createDynamicsCompressor(); master = ac.createGain(); master.gain.value = muted ? 0 : .6;
      master.connect(comp); comp.connect(ac.destination);
    } catch (e) { ac = null; return; }
  }
  if (ac.state !== 'running' && ac.resume) { const r = ac.resume(); if (r && r.catch) r.catch(() => { }); }
}
// 어떤 입력이든 들어오면 오디오를 깨운다 (브라우저 자동재생 정책 대응)
['pointerdown', 'pointerup', 'keydown', 'touchend', 'click'].forEach(n => window.addEventListener(n, initAudio, true));
function tone(f0, f1, dur, type, vol, delay) {
  if (!ac) return; const t = ac.currentTime + (delay || 0);
  const o = ac.createOscillator(), g = ac.createGain(); o.type = type || 'sine';
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + Math.min(.02, dur / 3)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .02);
}
let noiseBuf = null;
function noise(dur, freq, q, vol, delay, type) {
  if (!ac) return; const t = ac.currentTime + (delay || 0);
  if (!noiseBuf) { noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
  const f = ac.createBiquadFilter(); f.type = type || 'bandpass'; f.frequency.value = freq; f.Q.value = q || 1;
  const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + .015); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t, Math.random()); s.stop(t + dur + .02);
}
/* 목소리 합성: 음높이 곡선 f[], 떨림 vib[속도,깊이Hz], 진폭 떨림 am[속도,깊이], 대역 필터 bp */
function voice(o) {
  if (!ac) return; const t = ac.currentTime + (o.delay || 0), d = o.dur, f = o.f;
  const osc = ac.createOscillator(); osc.type = o.wave || 'sawtooth';
  osc.frequency.setValueAtTime(f[0], t);
  for (let i = 1; i < f.length; i++) osc.frequency.linearRampToValueAtTime(f[i], t + d * i / (f.length - 1));
  let node = osc;
  if (o.vib) { const l = ac.createOscillator(), lg = ac.createGain(); l.frequency.value = o.vib[0]; lg.gain.value = o.vib[1]; l.connect(lg); lg.connect(osc.frequency); l.start(t); l.stop(t + d + .05); }
  if (o.bp) { const fl = ac.createBiquadFilter(); fl.type = 'bandpass'; fl.frequency.value = o.bp; fl.Q.value = o.q || 1; node.connect(fl); node = fl; }
  const g = ac.createGain(), v = o.vol;
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + Math.min(.03, d * .2)); g.gain.setValueAtTime(v, t + d * .65); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  node.connect(g); let out = g;
  if (o.am) { const a = ac.createGain(); a.gain.value = 1 - o.am[1] / 2; const l = ac.createOscillator(), lg = ac.createGain(); l.frequency.value = o.am[0]; lg.gain.value = o.am[1] / 2; l.connect(lg); lg.connect(a.gain); l.start(t); l.stop(t + d + .05); g.connect(a); out = a; }
  out.connect(master); osc.start(t); osc.stop(t + d + .05);
  if (o.nz) noise(d, o.bp || 1000, .8, v * o.nz, o.delay || 0);
}
/* 동물별 기본 울음소리 */
const VOICE = {
  squeak: { wave: 'sine', f: [2300, 3300, 2500], dur: .09, vol: .6 },                                          // 햄스터 찍
  peep: { wave: 'sine', f: [3100, 3900, 2500], dur: .14, vol: .5 },                                             // 병아리 삐약
  honk: { wave: 'triangle', f: [720, 1080, 820], dur: .15, vol: .42 },                                          // 토끼 뀨
  meow: { wave: 'sawtooth', f: [520, 840, 780, 470], dur: .55, bp: 1400, q: 1.6, vib: [6, 14], vol: .7 },       // 고양이 야옹
  yap: { wave: 'sawtooth', f: [700, 560, 340], dur: .13, bp: 1300, q: .9, nz: .5, vol: .75 },                   // 강아지 멍
  woof: { wave: 'sawtooth', f: [390, 300, 170], dur: .19, bp: 750, q: .8, nz: .6, vol: .9 },                    // 큰 개 컹
  oink: { wave: 'sawtooth', f: [240, 180, 210], dur: .22, am: [40, .95], bp: 800, q: .8, vol: .9 },             // 돼지 꿀
  bleat: { wave: 'sawtooth', f: [440, 470, 400], dur: .65, vib: [11, 38], am: [11, .55], bp: 1100, q: 1.2, vol: .7 }, // 염소 메에에
  neigh: { wave: 'sawtooth', f: [1350, 1050, 720, 430], dur: .85, vib: [13, 95], bp: 1500, q: .7, vol: .65 },   // 조랑말 히히힝
  hum: { wave: 'triangle', f: [330, 420, 340], dur: .5, vib: [7, 16], vol: .5 },                                // 알파카 므으
  whimper: { wave: 'sine', f: [640, 980, 700], dur: .36, vib: [18, 45], vol: .42 },                             // 판다 끼잉
  roar: { wave: 'sawtooth', f: [135, 108, 76], dur: .75, am: [26, .85], bp: 420, q: .6, nz: .5, vol: 1.1 },     // 곰 크앙
  grunt: { wave: 'sawtooth', f: [100, 84, 72], dur: .5, am: [9, .95], bp: 320, q: .6, vol: 1.2 },               // 하마 푸우
  trumpet: { wave: 'sawtooth', f: [470, 900, 840, 620], dur: .6, vib: [24, 45], bp: 1600, q: .9, vol: .6 }      // 코끼리 뿌우
};
function call(sp, m) {
  const c = VOICE[sp.v], n = c.f.length - 1, p = m.p || 1, b = m.bend || 0;
  voice(Object.assign({}, c, { f: c.f.map((x, i) => x * p * (1 + b * i / n)), dur: c.dur * (m.d || 1), vol: c.vol * (m.v == null ? 1 : m.v), delay: m.delay || 0, bp: c.bp ? c.bp * Math.sqrt(p) : 0 }));
}
/* 감정별 연출: 같은 동물이라도 상태에 따라 다르게 운다 */
function emote(p, e) {
  const sp = p.sp, D = VOICE[sp.v].dur, v = 1;
  if (e === 'hungry') {            // 축 처진 긴 울음 두 번 + 꼬르륵
    call(sp, { p: .85, d: 1.5, bend: -.25, v }); call(sp, { p: .76, d: 1.8, bend: -.32, v: v * .8, delay: D * 1.5 + .22 });
    voice({ wave: 'triangle', f: [150, 230, 120, 200, 110], dur: .8, am: [15, .8], vol: .5, delay: D * 3.3 + .35 });
  } else if (e === 'thirsty') {    // 헥헥 숨소리 + 쉰 목소리
    for (let i = 0; i < 5; i++) noise(.08, 1300 + 700 * Math.min(2, sp.p), 2, .3, i * .15);
    call(sp, { p: .92, d: .6, bend: -.15, v: v * .45, delay: .85 });
  } else if (e === 'beg') {        // 신나서 점점 높아지는 세 번
    for (let i = 0; i < 3; i++) call(sp, { p: 1.2 + i * .1, d: .55, bend: .22, v, delay: i * (D * .55 + .1) });
  } else if (e === 'happy') {      // 올라가는 두 번 + 반짝
    call(sp, { p: 1.15, d: .7, bend: .15, v }); call(sp, { p: 1.38, d: .7, bend: .28, v, delay: D * .7 + .08 });
    tone(1400, 2100, .12, 'sine', .12, D * 1.4 + .2);
  } else if (e === 'angry') {      // 낮고 거친 소리 + 퉤
    call(sp, { p: .68, d: .85, bend: -.2, v: v * 1.15 }); noise(.16, 2400, 1.5, .4, D * .85 + .05); tone(420, 140, .16, 'sawtooth', .16, D * .85 + .05);
  } else if (e === 'scared') {     // 깜짝 놀란 높은 비명
    call(sp, { p: 1.6, d: .5, bend: .35, v }); call(sp, { p: 1.75, d: .4, bend: .3, v: v * .9, delay: D * .5 + .06 });
  } else if (e === 'sick') {       // 힘없는 소리 + 기침
    call(sp, { p: .8, d: 1.6, bend: -.38, v: v * .55 }); const t0 = D * 1.6 + .15;
    noise(.12, 520, .8, .5, t0, 'lowpass'); noise(.15, 430, .8, .5, t0 + .2, 'lowpass');
  } else if (e === 'dirty') {      // 벅벅 긁는 소리 + 투덜
    for (let i = 0; i < 6; i++) noise(.04, 3200, 4, .22, i * .07); call(sp, { p: .82, d: .6, v: v * .55, delay: .5 });
  } else if (e === 'squeal') {     // 목욕 중 꺅꺅
    call(sp, { p: 1.3 + Math.random() * .5, d: .4, bend: R(-.2, .3), v: v * .6 });
  } else call(sp, { p: 1.1, d: .7, bend: .1, v: v * .7 });
}
const SFX = {
  eat() { for (let i = 0; i < 5; i++) { noise(.05, 2600, 1.5, .34, i * .13, 'highpass'); tone(180, 120, .05, 'square', .07, i * .13); } },
  drink() { for (let i = 0; i < 4; i++) tone(520 - i * 30, 250, .1, 'sine', .3, i * .16); },
  take() { tone(500, 800, .08, 'triangle', .3); },
  grab() { tone(300, 520, .1, 'triangle', .32); noise(.08, 800, 1, .2); },
  splash() { noise(.4, 900, .7, .55); tone(300, 120, .25, 'sine', .25); },
  scrub() { noise(.09, 2600, 3, .3); tone(900 + Math.random() * 500, 1500, .06, 'sine', .1); },
  clean() { [660, 880, 1100, 1320].forEach((f, i) => tone(f, f * 1.01, .16, 'triangle', .26, i * .08)); },
  sweep() { noise(.2, 1800, 1, .35); },
  tick() { tone(900, 700, .05, 'square', .12); },
  step() { tone(110, 60, .16, 'triangle', .5); noise(.08, 200, 1, .3, 0, 'lowpass'); },
  slam() { noise(.4, 180, .7, 1, 0, 'lowpass'); tone(120, 40, .45, 'triangle', .9); },
  praise() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, f, .22, 'triangle', .3, i * .12)); },
  scold() { for (let i = 0; i < 6; i++) tone(200 - i * 12, 100, .22, 'sawtooth', .32, i * .16); noise(1, 300, .6, .4, 0, 'lowpass'); }
};

/* ---------- 데이터 ---------- */
const FOOD = {
  seed: { e: '🌻', n: '해바라기씨' }, grain: { e: '🌾', n: '모이' }, carrot: { e: '🥕', n: '당근' }, fish: { e: '🐟', n: '생선' },
  kibble: { e: '🦴', n: '뼈다귀 사료' }, meat: { e: '🍖', n: '고기' }, corn: { e: '🌽', n: '옥수수' }, grass: { e: '🌿', n: '풀' },
  apple: { e: '🍎', n: '사과' }, lettuce: { e: '🥬', n: '채소' }, bamboo: { e: '🎋', n: '대나무' }, honey: { e: '🍯', n: '꿀' },
  melon: { e: '🍉', n: '수박' }, banana: { e: '🍌', n: '바나나' }, snack: { e: '🍪', n: '간식' }, water: { e: '💧', n: '물' }
};
const SP = {
  hamster: { n: '햄스터', e: '🐹', r: 33, v: 'squeak', sp: 175, col: '#f1c27d', col2: '#fff3dc', ear: 'round', tail: 'none', whisk: 1, cheeks: 1, food: 'seed', cry: '찍찍', p: 2.0, head: .72, leg: .2 },
  chick: { n: '병아리', e: '🐥', r: 30, v: 'peep', sp: 150, col: '#ffd84a', col2: '#fff0a0', ear: 'none', tail: 'short', beak: 1, legs: 2, legCol: '#f08a24', food: 'grain', cry: '삐약', p: 2.3, head: .7, leg: .45 },
  rabbit: { n: '토끼', e: '🐰', r: 40, v: 'honk', sp: 185, col: '#f4f1ec', col2: '#ffffff', ear: 'long', tail: 'fluff', whisk: 1, food: 'carrot', cry: '뀨뀨', p: 1.7, head: .66, leg: .28, dark: '#d9d2c8' },
  cat: { n: '고양이', e: '🐱', r: 48, v: 'meow', sp: 180, col: '#f0a04b', col2: '#fff1dd', ear: 'pointy', tail: 'long', whisk: 1, stripes: 1, food: 'fish', cry: '야옹', p: 1.5, dark: '#c9772a' },
  puppy: { n: '강아지', e: '🐶', r: 51, v: 'yap', sp: 165, col: '#e8d2b0', col2: '#fff8ea', ear: 'floppy', tail: 'dog', patch: 1, food: 'kibble', cry: '멍멍', p: 1.3, dark: '#9b6a43' },
  dog: { n: '리트리버', e: '🐕', r: 63, v: 'woof', sp: 170, col: '#e0a95c', col2: '#f6d9a8', ear: 'floppy', tail: 'dog', food: 'meat', cry: '컹컹', p: .9, dark: '#b57f38', leg: .5 },

/* ---------- 업데이트 ---------- */
function updatePlayer(dt) {
  let mx = 0, my = 0;
  if (keys.ArrowLeft || keys.KeyA) mx -= 1; if (keys.ArrowRight || keys.KeyD) mx += 1;
  if (keys.ArrowUp || keys.KeyW) my -= 1; if (keys.ArrowDown || keys.KeyS) my += 1;
  if (joy.id !== null) { const dx = joy.x - joy.ox, dy = joy.y - joy.oy, l = Math.hypot(dx, dy); if (l > 10) { const k = Math.min(1, l / 50); mx = dx / l * k; my = dy / l * k; } }
  const l = Math.hypot(mx, my); if (l > 1) { mx /= l; my /= l; }
  pl.moving = l > .1;
  if (pl.moving) {
    const spd = 235 * (pl.pet ? 1 - Math.min(.42, pl.pet.sp.r / 160) : 1);
    pl.x += mx * spd * dt; pl.y += my * spd * dt; if (Math.abs(mx) > .15) pl.dir = mx > 0 ? 1 : -1;
    pl.phase += dt * 13; collide(pl, 18);

  // 욕조: 일정 시간 동안 저절로 씻긴다
  for (const w of tub) {
    w.t += dt; w.p.dirt = Math.max(0, w.p.dirt - dt * 100 / w.dur);
    if (Math.random() < dt * 7) { SFX.scrub(); burst(w.p.x + R(-40, 40), TUB.y + 6, 'bubble', 1); }
    if (Math.random() < dt * .7) emote(w.p, 'squeal');
    if (w.t >= w.dur) {
      const p = w.p; p.dirt = 0; p.health = Math.min(100, p.health + 12); p.state = 'free'; p.y = TUB.y + TUB.h + 40 + R(0, 30); collide(p, p.cr);
      p.cleanT = 4; p.happyT = 2; p.stam = 2.6; p.pause = 1.5; p.path = []; w.done = true; score += 100;
      SFX.clean(); emote(p, 'happy'); burst(p.x, p.y - p.sp.r, 'spark', 12); say(p, '뽀송뽀송!', '#2a9fb8', 1);
    }
  }

}
function wantOf(p) {

  if (p.thirst >= v) { w = 'thirst'; v = p.thirst; }
  if (p.hunger > v || (p.hunger >= 60 && !w)) { w = 'hunger'; v = p.hunger; }
  if (p.snack > v || (p.snack >= 60 && !w)) w = 'snack';
  return w;
}
function chooseGoal(p) {

  if (p.want === 'hunger' && Math.random() < .6) { const s = stations.find(s => s.type === p.sp.food); t = { x: s.x + R(-30, 30), y: R(236, 290) }; p.goal = 'kitchen'; }
  else if (p.want === 'thirst' && Math.random() < .5) { t = Math.random() < .5 ? { x: 510 + R(-30, 30), y: R(236, 290) } : { x: TUB.x + R(20, TUB.w - 20), y: TUB.y + TUB.h + R(34, 70) }; p.goal = 'water'; }
  else if (p.want === 'snack') { t = { x: pl.x + R(-50, 50), y: pl.y + R(20, 50) }; p.goal = 'beg'; }
  else if (p.dirt >= 68 && Math.random() < .45) { t = pick(HIDES); p.goal = 'hide'; }
  else { t = randPoint(); p.goal = 'wander'; }
  if (inSolid(t.x, t.y, 4) && p.goal !== 'hide') t = randPoint();

function updatePet(p, dt) {

  if (dmg > 0) p.health = Math.max(0, p.health - dmg * dt); else if (p.dirt < 40) p.health = Math.min(100, p.health + .8 * dt);

function drawWorld() {
  const c = ctx; if (!houseCv) buildHouse();

function drawMom(c, x, y, s, mood, t) {

  else { c.beginPath(); c.moveTo(-52, -170); c.lineTo(-76, -110); c.lineTo(-40, -92); c.stroke(); c.beginPath(); c.moveTo(52, -170); c.lineTo(76, -110); c.lineTo(40, -92); c.stroke(); }

    else if (mood !== 'inspect' || Math.sin(t * 3) <= .2) { c.lineWidth = 4; c.beginPath(); c.moveTo(sgn * 24 - 9, -234); c.lineTo(sgn * 24 + 9, -234); c.stroke(); } }

function drawMomScene() {
  const c = ctx, m = mom, t = m.t;
  c.fillStyle = 'rgba(30,16,12,' + clamp(t * 1.2, 0, .78) + ')'; c.fillRect(0, 0, VW, VH);

  const ms = Math.min(1, VH / 560), mx = clamp(-200 + t * 420, -200, VW * .17);
  drawMom(c, mx, VH - 16, ms, mood, t);
  if (t < 2) { txt(c, '쾅!!', VW / 2, VH * .32, 76, '#ffd54a', 'center', '#4a3226'); txt(c, m.collapsed ? m.collapsed.sp.n + '이(가) 쓰러졌다! 엄마가 달려왔다!' : '엄마가 돌아왔다!', VW / 2, VH * .5, 28, '#fff', 'center', '#4a3226'); return; }

  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt);
  ctx.setTransform(DPR * SC, 0, 0, DPR * SC, 0, 0);
  ctx.fillStyle = '#3b2a22'; ctx.fillRect(0, 0, VW, VH);
  drawWorld();
  if (state === 'play' || state === 'mom') drawHUD();
  if (state === 'mom') drawMomScene();
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { last = performance.now(); });
