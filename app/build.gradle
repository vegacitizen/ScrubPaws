plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vegacitizen.scrubpaws'
    compileSdk 35

    defaultConfig {
        applicationId 'com.vegacitizen.scrubpaws'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    // 빌드할 때마다 같은 키로 서명해야 기존 앱 위에 덮어 설치되고 저장 데이터가 유지된다.
    // 저장소에 들어 있는 디버그 전용 키이므로 스토어 배포용으로는 쓰지 않는다.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
